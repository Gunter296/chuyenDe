<rect width="980" height="360" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:24px;font-weight:bold}.sub{font-size:15px}.number{font-size:42px;font-weight:bold;fill:#334155}.label{font-size:17px;font-weight:bold}.box{fill:white;stroke:#cbd5e1;stroke-width:2}</style>
<text x="35" y="42" class="title">RNN trong bài báo gốc - mốc tham khảo riêng</text>
