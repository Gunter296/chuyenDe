<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><defs><pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f1e7fb"/><rect width="3" height="8" fill="#a678cf"/></pattern></defs><rect width="1200" height="630" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#182235}.title{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#475569}.panel{fill:white;stroke:#dbe3ee;stroke-width:1.5}.heading{font-size:21px;font-weight:bold}.lab{font-size:16px}.val{font-size:17px;font-weight:bold}.tick{font-size:13px;fill:#64748b}.grid{stroke:#e7edf4}.note{font-size:14px;fill:#7c3e19}</style><text x="36" y="45" class="title">MAE và RMSE chung: ba phương án</text><text x="36" y="74" class="sub">RNN + chọn máy và GNN dùng cùng test · RNN bài báo gốc là mốc khác giao thức</text><rect x="30" y="108" width="555" height="388" rx="14" class="panel"/><text x="52" y="146" class="heading">MAE chung</text><line x1="204" y1="170" x2="204" y2="448" class="grid"/><text x="192" y="471" class="tick">0.0</text><line x1="289" y1="170" x2="289" y2="448" class="grid"/><text x="277" y="471" class="tick">0.1</text><line x1="374" y1="170" x2="374" y2="448" class="grid"/><text x="362" y="471" class="tick">0.2</text><line x1="459" y1="170" x2="459" y2="448" class="grid"/><text x="447" y="471" class="tick">0.3</text><line x1="544" y1="170" x2="544" y2="448" class="grid"/><text x="532" y="471" class="tick">0.4</text><text x="52" y="208" class="lab">RNN + chọn máy</text><rect x="204" y="187" width="185.33149502273463" height="34" rx="4" fill="#e28b2e"/><text x="398.33149502273466" y="209" class="val">0,21804</text><text x="52" y="296" class="lab">GNN chỉ dự báo</text><rect x="204" y="275" width="123.2787013279418" height="34" rx="4" fill="#3477d1"/><text x="336.2787013279418" y="297" class="val">0,14503</text><text x="52" y="384" class="lab">RNN bài báo gốc</text><rect x="204" y="363" width="161.5" height="34" rx="4" fill="url(#stripe)"/><text x="374.5" y="385" class="val">0,19000</text><rect x="615" y="108" width="555" height="388" rx="14" class="panel"/><text x="637" y="146" class="heading">RMSE chung</text><line x1="789" y1="170" x2="789" y2="448" class="grid"/><text x="777" y="471" class="tick">0.0</text><line x1="874" y1="170" x2="874" y2="448" class="grid"/><text x="862" y="471" class="tick">0.1</text><line x1="959" y1="170" x2="959" y2="448" class="grid"/><text x="947" y="471" class="tick">0.2</text><line x1="1044" y1="170" x2="1044" y2="448" class="grid"/><text x="1032" y="471" class="tick">0.3</text><line x1="1129" y1="170" x2="1129" y2="448" class="grid"/><text x="1117" y="471" class="tick">0.4</text><text x="637" y="208" class="lab">RNN + chọn máy</text><rect x="789" y="187" width="291.66382484866523" height="34" rx="4" fill="#e28b2e"/><text x="1089.6638248486652" y="209" class="val">0,34313</text><text x="637" y="296" class="lab">GNN chỉ dự báo</text><rect x="789" y="275" width="171.84611718550252" height="34" rx="4" fill="#3477d1"/><text x="969.8461171855025" y="297" class="val">0,20217</text><text x="637" y="384" class="lab">RNN bài báo gốc</text><rect x="789" y="363" width="212.5" height="34" rx="4" fill="url(#stripe)"/><text x="1010.5" y="385" class="val">0,25000</text><rect x="30" y="514" width="1140" height="82" rx="10" fill="#fff6e7" stroke="#e8c99a"/><text x="50" y="542" class="note">Cột gạch chéo: số công bố trong Bảng 1 của bài báo gốc, không đo trên cùng cohort/test hoặc cùng cách gộp.</text><text x="50" y="568" class="sub">Hai phương án mới: MAE chung = (MAE CPU + MAE RAM)/2; RMSE chung = √[(RMSE CPU² + RMSE RAM²)/2].</text><text x="36" y="619" class="tick">Nguồn: comparison_full.json (138 cohort, 3.212 cặp container–cửa sổ test); bài báo gốc, trang 4, Bảng 1, RNN(Ours).</text></svg>
